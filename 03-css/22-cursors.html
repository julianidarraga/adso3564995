 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-Cursors</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div {
                border: 2px solid #fff9;
                height: 140px;
                &.cursor-move      { cursor: move; }
                &.cursor-help      { cursor: help; }
                &.cursor-crosshair { cursor: crosshair; }
                &.cursor-image     { cursor: url(imgs/pointer.png), default; }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>22-Cursors</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Specifies the mouse cursor to be displayed when pointing over an element.</h3>
        </header>
        <section>
            <h3 class="subtitle">Move:</h3>
            <div class="cursor-move"></div>
            <h3 class="subtitle">Help:</h3>
            <div class="cursor-help"></div>
            <h3 class="subtitle">Crosshair:</h3>
            <div class="cursor-crosshair"></div>
            <h3 class="subtitle">Image (Custom):</h3>
            <div class="cursor-image"></div>
        </section>
    </main>
</body>
</html>
