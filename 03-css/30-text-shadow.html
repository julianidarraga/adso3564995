    <style>
        section {
            p.txt {
                font-size: 4rem;
                font-weight: 600;
                margin: 1rem 0;
                text-align: center;
&.txt1 {
    color: #0f172a;
    text-shadow: 0 0 6px #38bdf8;
}

&.txt2 {
    color: #1e3a8a;
    text-shadow: -4px -4px 4px #93c5fd;
}

&.txt3 {
    color: #0f172a;
    font-weight: 900;
    letter-spacing: 0.4rem;
    text-shadow: 1px 1px #000, 
                  2px 2px #fff, 
                  3px 3px #fff, 
                  4px 4px #fff, 
                  5px 5px #fff, 
                  6px 6px #fff;
}

&.txt4 {
    color: #d4af37;
    letter-spacing: 0.6rem;
    text-shadow: -5px 0 0 #8b6914,
                 -10px 0 0 #3f2d0b;
               } 
            }
        }
    </style>
</head>
