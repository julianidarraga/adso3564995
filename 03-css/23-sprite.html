<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-sprite</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div#runner {
            background: url(imgs/run-sprite.png)no-repeat;
            border: 2px solid red;
                height: 256px;
                margin: 2rem auto;
                width: 256px;
                &.sp1 {background-position: calc(-256px * 0) 0;}
                &.sp1 {background-position: calc(-256px * 1) 0;}
                &.sp1 {background-position: calc(-256px * 2) 0;}
                &.sp1 {background-position: calc(-256px * 2) 0;}
                &.sp1 {background-position: calc(-256px * 4) 0;}
                &.sp1 {background-position: calc(-256px * 5) 0;}
            }
            div#dino {
            background: url(imgs/dino-sprite.png)no-repeat;
                height: 128px;
                margin: 2rem auto;
                width: 128px;
                &.sp1 {background-position: calc(-128px * 0) 0;}
                &.sp1 {background-position: calc(-128px * 1) 0;}
            }
        }
    </style>
    </head>
    <body class="css">
     <nav class="goback">
            <a href="index.html">
                 <svg xmlns=< xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a> 
        </nav>
    <main>
        <header class="mmenu internal">
            <h1>23-Sprites</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Description.</h3>
        </header>
        <section>
            <h3 class="subtitle">Runner:</h3>
            <div id="runner" class="sp1"></div>
            <h3 class="subtitle">Dino:</h3>
            <div id="dino" class="sp1"></div>
        </section>
    </main>
    <script>
        const runner        = document.getElementById('runner');
        const runnerSprites = 6;
        let countRunner     = 1;

        setInterval(() => {
            if (countRunner == runnerSprites) {
                runner.className = '';
                countRunner = 1;
            } else {
                runner.className = '';
                runner.classList.add('sp'+ ++countRunner)
            }
        }, 80);

        const dino       = document.getElementById('dino');
        const dinoSprites = 2;
        let countdino     = 1;

        setInterval(() => {
            if (countdino == dinoSprites) {
                dino.className = '';
                countdino = 1;
            } else {
                dino.className = '';
                dino.classList.add('sp'+ ++countdino)
            }
        }, 80);

    </script>
    </body>
</html>
