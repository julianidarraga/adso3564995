 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Steps</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        :root {
            --size: 256px;
        }
        body {
            overflow-y: hidden;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png)
                            no-repeat center / cover;
                outline: 4px solid #fff;
                border-radius: 12px;
                corner-shape: squircle;
                position: relative;
                height: 500px;

                div.instructions {
                    background: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    text-align: center;
                    outline: 4px solid #fff;
                    padding: 0.4rem;
                    position: absolute;
                    top: 26px;
                    left: 26px;
                    width: 300px;
                }

                div.trainer {
                    background: url(imgs/steps-all.png)
                                no-repeat;
                    background-position-x: 0;
                    transform: scale(.8);
                    position: absolute;
                    bottom: 0px;
                    left: 50px;
                    height: var(--size);
                    width: var(--size);

                    animation: 0.6s animTrainer steps(4) infinite;

                    &.front { background-position-y: calc(var(--size)*0); }
                    &.left  { background-position-y: calc(var(--size)*-1); }
                    &.right { background-position-y: calc(var(--size)*-2); }
                    &.back  { background-position-y: calc(var(--size)*-3); }
                }
            }
        }

        @keyframes animTrainer {
            100% { background-position-x: calc(var(--size) * -4); }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>40-Steps</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>used in CSS animations to split transitions into discrete frames, commonly used for frame-by-frame sprite animations.</h3>
        </header>
        <section>
            <div class="bg">
                <div class="instructions">
                    Please press arrow keys: 
                    <br>
                    &larr; &uarr; &rarr; &darr; 
                </div>
                <div class="trainer front"></div>
            </div>
        </section>
    </main>
    <script>
        const trainer = document.querySelector('.trainer');
        document.addEventListener('keyup', function(e) {
            switch (e.keyCode) {
                case 37: // Left
                    trainer.classList.remove('front', 'right', 'back');
                    trainer.classList.add('left');
                    break;
                case 38: // Front
                    trainer.classList.remove('left', 'right', 'back');
                    trainer.classList.add('front');
                    break;
                case 39: // Right
                    trainer.classList.remove('left', 'front', 'back');
                    trainer.classList.add('right');
                    break;
                case 40: // Back
                    trainer.classList.remove('left', 'front', 'right');
                    trainer.classList.add('back');
                    break;
            }
        });
    </script>
</body>
</html>
