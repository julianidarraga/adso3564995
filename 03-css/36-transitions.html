<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transition01 {
                    transition: transform 0.6s ease;

                    &:hover {
                        transform: scale(1.3);

                    }
                }
                &.transition02 {
                    transition: all 0.2s ease-out;

                    &:hover {
                        transform: rotate(-0.5turn);

                    }
                }
                &.transition03 {
                    transition: transform 1s ease-in;

                    &:hover {
                        transform: RotateY(180deg);
                    }
                }
                &.transition04 {
                    transition: transform 0.4s linear;

                    &:hover {
                        transform: translateX(80px);
                
                    }  
                }
            }
            div.box {
                background: #f00;
                height: 80px;
                width: 80px;
                margin-bottom: 2rem;
                transition: width 1s ease,
                            height 1s 1s ease,
                            background 1s 2s ease,
                            transform 1s 3s ease;
            &:hover {
                background: #ff0;
                width: 360px;
                height: 180px;
                transform: rotate(360deg);
            }
        }
    }
    </style>
    </head>
    <body class="css">
     <nav class="goback">
            <a href="index.html">
                 <svg xmlns=< xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a> 
        </nav>
    <main>
        <header class="mmenu internal">
            <h1>36-Transitions</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Technique controlling the speed and timing curve when changing property values smoothly between state changes (e.g., on :hover).</h3>
        </header>
        <section>
            <h3 class="subtitle">Scale(1.3):</h3>
            <img class="transition01" src="imgs/dk.png" alt="DK">
            <h3 class="subtitle">Rotate(-0.5turn):</h3>
            <img class="transition02" src="imgs/dk.png" alt="DK">
            <h3 class="subtitle">RotateY(180deg):</h3>
            <img class="transition03" src="imgs/dk.png" alt="DK">
            <h3 class="subtitle">TranslateX(80px):</h3>
            <img class="transition04" src="imgs/dk.png" alt="DK">
            <h3 class="subtitle">Multiple:</h3>
            <div class="box"></div>
        </section>
    </main>
    </body>
</html>
